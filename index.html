<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ Футбол онлайн</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: linear-gradient(160deg, #0b1a2e 0%, #1a3a4a 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 8px;
            touch-action: manipulation;
        }
        #app {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 16px 14px 20px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }
        .currency {
            display: flex;
            gap: 10px;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .currency span {
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .star { color: #f9d71c; }
        .crystal { color: #7ee0ff; }
        .btn {
            background: #2d4a57;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #1a2f38;
            transition: 0.08s ease;
            touch-action: manipulation;
            min-height: 48px;
            min-width: 48px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #1a2f38;
        }
        .btn-primary {
            background: #e6b42c;
            color: #1f2e3a;
            box-shadow: 0 4px 0 #8f6e1a;
        }
        .btn-danger {
            background: #c73d3d;
            box-shadow: 0 4px 0 #741f1f;
        }
        .btn-success {
            background: #2e9e5a;
            box-shadow: 0 4px 0 #1a5f35;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .match-box {
            background: rgba(0,0,0,0.35);
            border-radius: 28px;
            padding: 16px 12px;
            margin: 12px 0;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .score {
            font-size: 3.2rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            text-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .score span {
            min-width: 50px;
        }
        .vs {
            font-size: 1.2rem;
            color: #88aabb;
        }
        .events {
            margin-top: 10px;
            font-size: 0.85rem;
            max-height: 90px;
            overflow-y: auto;
            background: rgba(0,0,0,0.25);
            border-radius: 16px;
            padding: 8px 10px;
            text-align: left;
            scroll-behavior: smooth;
        }
        .events div {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .leaders {
            background: rgba(0,0,0,0.25);
            border-radius: 20px;
            padding: 12px 14px;
            margin-top: 12px;
        }
        .leaders h4 {
            font-size: 0.9rem;
            color: #bbd4e0;
            margin-bottom: 6px;
        }
        .leader-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .actions .btn {
            font-size: 0.85rem;
            padding: 10px 6px;
            min-height: 52px;
        }
        .flex {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .flex-center {
            justify-content: center;
        }
        input {
            padding: 12px 16px;
            border-radius: 60px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 1rem;
            flex: 1;
            min-width: 120px;
            outline: none;
        }
        input::placeholder { color: #8899aa; }
        #status {
            text-align: center;
            margin: 8px 0 4px;
            font-size: 0.9rem;
            color: #aaccee;
            min-height: 28px;
            font-weight: 500;
        }
        .opponent-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f0e68c;
        }
        .hidden { display: none !important; }
        .mt-8 { margin-top: 8px; }
        .mb-8 { margin-bottom: 8px; }
    </style>
</head>
<body>
<div id="app">
    <!-- ШАПКА -->
    <div class="header">
        <div class="currency">
            <span><span class="star">⭐</span> <span id="stars">0</span></span>
            <span><span class="crystal">💎</span> <span id="crystals">0</span></span>
            <span>📊 <span id="rating">50</span></span>
        </div>
        <button class="btn btn-primary" id="openPackBtn" style="font-size:0.8rem; padding:8px 14px;">📦 Пак</button>
    </div>

    <!-- ВХОД -->
    <div class="flex flex-center" style="margin-top:12px;">
        <input id="nameInput" placeholder="Твой ник" value="Игрок" maxlength="16">
        <button class="btn btn-success" id="joinBtn">✅ Войти</button>
    </div>

    <div id="status">⏳ Войди в игру</div>

    <!-- ОЖИДАНИЕ -->
    <div id="waitingArea" class="match-box hidden">
        <div style="font-size:1.4rem;">⏳</div>
        <div style="font-weight:600;">Поиск соперника...</div>
        <div style="font-size:0.8rem; color:#88aabb;">Игроков в очереди: <span id="queueCount">0</span></div>
    </div>

    <!-- МАТЧ -->
    <div id="matchArea" class="match-box hidden">
        <div>⚔️ <span class="opponent-name" id="opponentName">Соперник</span></div>
        <div class="score">
            <span id="score1">0</span>
            <span class="vs">vs</span>
            <span id="score2">0</span>
        </div>
        <div id="eventsLog" class="events"></div>
        <div class="actions">
            <button class="btn btn-primary" id="actionGoal">⚽ Удар</button>
            <button class="btn" id="actionFoul" style="background:#b8860b; box-shadow:0 4px 0 #6d5000;">🟨 Фол</button>
            <button class="btn" id="actionOffside" style="background:#4a6a7a; box-shadow:0 4px 0 #2a3a4a;">🚩 Оффсайд</button>
        </div>
        <button class="btn btn-danger btn-block mt-8" id="endMatchBtn">🏁 Завершить матч</button>
    </div>

    <!-- ЛИДЕРЫ -->
    <div class="leaders">
        <h4>🏆 ТОП-10</h4>
        <div id="leadersList">
            <div class="leader-item" style="color:#8899aa;">Загрузка...</div>
        </div>
    </div>

    <div style="text-align:center; font-size:0.65rem; color:#445566; margin-top:12px;">
        ⚡ Сделано с ❤️ • Играй с друзьями!
    </div>
</div>

<script>
    const socket = io();
    let playerName = '';
    let roomId = null;

    // Элементы
    const starsEl = document.getElementById('stars');
    const crystalsEl = document.getElementById('crystals');
    const ratingEl = document.getElementById('rating');
    const statusEl = document.getElementById('status');
    const matchArea = document.getElementById('matchArea');
    const waitingArea = document.getElementById('waitingArea');
    const opponentName = document.getElementById('opponentName');
    const score1 = document.getElementById('score1');
    const score2 = document.getElementById('score2');
    const eventsLog = document.getElementById('eventsLog');
    const leadersList = document.getElementById('leadersList');
    const queueCount = document.getElementById('queueCount');

    // ВИБРАЦИЯ (если поддерживается)
    function vibrate(ms = 20) {
        if (navigator.vibrate) navigator.vibrate(ms);
    }

    // ВХОД
    document.getElementById('joinBtn').onclick = () => {
        playerName = document.getElementById('nameInput').value.trim() || 'Игрок';
        socket.emit('join', playerName);
        vibrate(15);
    };

    // СОБЫТИЯ СОКЕТА
    socket.on('updateProfile', (data) => {
        starsEl.textContent = data.stars;
        crystalsEl.textContent = data.crystals;
        ratingEl.textContent = data.teamRating;
        vibrate(10);
    });

    socket.on('waiting', (msg) => {
        statusEl.textContent = '⏳ ' + msg;
        waitingArea.classList.remove('hidden');
        matchArea.classList.add('hidden');
    });

    socket.on('queueUpdate', (count) => {
        queueCount.textContent = count;
    });

    socket.on('matchStart', (data) => {
        roomId = data.roomId;
        opponentName.textContent = data.opponent;
        score1.textContent = '0';
        score2.textContent = '0';
        eventsLog.innerHTML = '';
        statusEl.textContent = '🔴 МАТЧ ИДЁТ!';
        waitingArea.classList.add('hidden');
        matchArea.classList.remove('hidden');
        vibrate(50);
    });

    socket.on('scoreUpdate', (data) => {
        score1.textContent = data.score1;
        score2.textContent = data.score2;
        vibrate(20);
    });

    socket.on('matchEvent', (event) => {
        const div = document.createElement('div');
        div.textContent = `⏱️ ${event.time}' ${event.text}`;
        eventsLog.appendChild(div);
        eventsLog.scrollTop = eventsLog.scrollHeight;
        vibrate(30);
    });

    socket.on('opponentAction', (data) => {
        statusEl.textContent = `👀 Соперник: ${data.action}`;
    });

    socket.on('matchResult', (data) => {
        let msg = '🤝 Ничья!';
        if (data.result === 'p1') msg = '🎉 ТЫ ПОБЕДИЛ! +⭐ +💎';
        else if (data.result === 'p2') msg = '😞 Ты проиграл... -⭐';
        statusEl.textContent = `${msg} (${data.score1}:${data.score2})`;
        matchArea.classList.add('hidden');
        vibrate(100);
        setTimeout(() => {
            socket.emit('join', playerName);
        }, 2500);
    });

    socket.on('updateLeaders', (leaders) => {
        if (!leaders || leaders.length === 0) {
            leadersList.innerHTML = '<div class="leader-item" style="color:#8899aa;">Пока никого нет</div>';
            return;
        }
        leadersList.innerHTML = leaders.map((p, i) =>
            `<div class="leader-item">
                <span>${i+1}. ${p.name}</span>
                <span>⭐${p.stars} 📊${p.teamRating}</span>
            </div>`
        ).join('');
    });

    socket.on('error', (msg) => {
        statusEl.textContent = '❌ ' + msg;
        vibrate(60);
    });

    socket.on('packResult', (msg) => {
        statusEl.textContent = '📦 ' + msg;
        vibrate(40);
    });

    // ДЕЙСТВИЯ В МАТЧЕ
    document.getElementById('actionGoal').onclick = () => {
        if (roomId) { socket.emit('action', { roomId, action: 'goal' }); vibrate(15); }
    };
    document.getElementById('actionFoul').onclick = () => {
        if (roomId) { socket.emit('action', { roomId, action: 'foul' }); vibrate(15); }
    };
    document.getElementById('actionOffside').onclick = () => {
        if (roomId) { socket.emit('action', { roomId, action: 'offside' }); vibrate(15); }
    };

    document.getElementById('endMatchBtn').onclick = () => {
        if (roomId) {
            socket.emit('endMatch', roomId);
            roomId = null;
            matchArea.classList.add('hidden');
            statusEl.textContent = '⏳ Матч завершён';
            vibrate(30);
        }
    };

    document.getElementById('openPackBtn').onclick = () => {
        socket.emit('openPack');
        vibrate(20);
    };

    // АВТОВХОД
    window.onload = () => {
        setTimeout(() => document.getElementById('joinBtn').click(), 300);
    };

    // СВАЙП-ЖЕСТЫ (для быстрых действий)
    let startX = 0, startY = 0;
    document.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    });
    document.addEventListener('touchend', (e) => {
        if (!startX || !startY) return;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const dx = endX - startX;
        const dy = endY - startY;
        if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 50) { // свайп вправо — удар
                document.getElementById('actionGoal').click();
            } else if (dx < -50) { // влево — фол
                document.getElementById('actionFoul').click();
            }
        } else {
            if (dy > 50) { // вниз — оффсайд
                document.getElementById('actionOffside').click();
            }
        }
        startX = 0; startY = 0;
    });
</script>
</body>
</html>
