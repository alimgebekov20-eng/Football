<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚽ Футбол онлайн</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: linear-gradient(160deg, #0b1a2e 0%, #1a3a4a 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 8px;
            touch-action: manipulation;
        }
        #app {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 16px 14px 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,215,0,0.15);
        }
        .currency {
            display: flex;
            gap: 10px;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .currency span {
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .star { color: #f9d71c; }
        .crystal { color: #7ee0ff; }
        .btn {
            background: #2d4a57;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #1a2f38;
            transition: 0.08s ease;
            touch-action: manipulation;
            min-height: 48px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #1a2f38; }
        .btn-primary { background: #e6b42c; color: #1f2e3a; box-shadow: 0 4px 0 #8f6e1a; }
        .btn-danger { background: #c73d3d; box-shadow: 0 4px 0 #741f1f; }
        .btn-success { background: #2e9e5a; box-shadow: 0 4px 0 #1a5f35; }
        .match-box {
            background: rgba(0,0,0,0.35);
            border-radius: 28px;
            padding: 16px 12px;
            margin: 12px 0;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .score {
            font-size: 2.8rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }
        .score span { min-width: 40px; }
        .vs { font-size: 1rem; color: #88aabb; }
        .events {
            margin-top: 10px;
            font-size: 0.8rem;
            max-height: 120px;
            overflow-y: auto;
            background: rgba(0,0,0,0.25);
            border-radius: 16px;
            padding: 8px 10px;
            text-align: left;
            scroll-behavior: smooth;
        }
        .events div {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-weight: 500;
        }
        .events .goal { color: #ffdd44; }
        .events .red { color: #ff4444; }
        .events .yellow { color: #ffcc00; }
        .events .offside { color: #88ccff; }
        .leaders {
            background: rgba(0,0,0,0.25);
            border-radius: 20px;
            padding: 12px 14px;
            margin-top: 12px;
        }
        .leaders h4 { font-size: 0.9rem; color: #bbd4e0; margin-bottom: 6px; }
        .leader-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.82rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .flex {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .flex-center { justify-content: center; }
        input {
            padding: 12px 16px;
            border-radius: 60px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: white;
            font-size: 1rem;
            flex: 1;
            min-width: 120px;
            outline: none;
        }
        input::placeholder { color: #8899aa; }
        #status {
            text-align: center;
            margin: 8px 0 4px;
            font-size: 0.9rem;
            color: #aaccee;
            min-height: 28px;
            font-weight: 500;
        }
        .opponent-name { font-size: 1.1rem; font-weight: 600; color: #f0e68c; }
        .hidden { display: none !important; }
        .mt-8 { margin-top: 8px; }
        .match-title {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #99bbcc;
            padding: 0 4px 8px 4px;
        }
        .time-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: #66ddff;
        }
        .rating-badge {
            background: rgba(255,215,0,0.15);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #f0e68c;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- ШАПКА -->
    <div class="header">
        <div class="currency">
            <span><span class="star">⭐</span> <span id="stars">0</span></span>
            <span><span class="crystal">💎</span> <span id="crystals">0</span></span>
            <span>📊 <span id="rating">50</span></span>
        </div>
        <button class="btn btn-primary" id="openPackBtn" style="font-size:0.8rem; padding:8px 14px;">📦 Пак (3💎)</button>
    </div>

    <!-- ВХОД -->
    <div class="flex flex-center" style="margin-top:12px;">
        <input id="nameInput" placeholder="Твой ник" value="Игрок" maxlength="16">
        <button class="btn btn-success" id="joinBtn">✅ Войти</button>
    </div>

    <div id="status">⏳ Войди в игру</div>

    <!-- ОЖИДАНИЕ -->
    <div id="waitingArea" class="match-box hidden">
        <div style="font-size:1.4rem;">⏳</div>
        <div style="font-weight:600;">Поиск соперника...</div>
        <div style="font-size:0.8rem; color:#88aabb;">Игроков в очереди: <span id="queueCount">0</span></div>
    </div>

    <!-- МАТЧ -->
    <div id="matchArea" class="match-box hidden">
        <div class="match-title">
            <span id="player1Name" style="font-weight:600;">Игрок1</span>
            <span class="time-display" id="matchTime">0'</span>
            <span id="player2Name" style="font-weight:600;">Игрок2</span>
        </div>
        <div class="match-title" style="font-size:0.7rem; padding-top:0; color:#8899aa;">
            <span class="rating-badge" id="rating1">📊 50</span>
            <span></span>
            <span class="rating-badge" id="rating2">📊 50</span>
        </div>
        <div class="score">
            <span id="score1">0</span>
            <span class="vs">vs</span>
            <span id="score2">0</span>
        </div>
        <div id="eventsLog" class="events"></div>
        <button class="btn btn-danger btn-block mt-8" id="endMatchBtn">🏁 Завершить матч</button>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div id="resultArea" class="match-box hidden">
        <div style="font-size:1.5rem; font-weight:700;" id="resultTitle">🏆</div>
        <div style="font-size:2rem; font-weight:800; margin:4px 0;" id="resultScore">0:0</div>
        <div style="font-size:0.9rem; color:#aaccee;" id="resultDetails"></div>
        <button class="btn btn-primary" id="continueBtn" style="margin-top:10px;">🔁 Продолжить</button>
    </div>

    <!-- ЛИДЕРЫ -->
    <div class="leaders">
        <h4>🏆 ТОП-10</h4>
        <div id="leadersList">
            <div class="leader-item" style="color:#8899aa;">Загрузка...</div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let playerName = '';
    let roomId = null;
    let matchActive = false;

    const starsEl = document.getElementById('stars');
    const crystalsEl = document.getElementById('crystals');
    const ratingEl = document.getElementById('rating');
    const statusEl = document.getElementById('status');
    const matchArea = document.getElementById('matchArea');
    const waitingArea = document.getElementById('waitingArea');
    const resultArea = document.getElementById('resultArea');
    const score1 = document.getElementById('score1');
    const score2 = document.getElementById('score2');
    const eventsLog = document.getElementById('eventsLog');
    const leadersList = document.getElementById('leadersList');
    const queueCount = document.getElementById('queueCount');
    const matchTime = document.getElementById('matchTime');
    const player1Name = document.getElementById('player1Name');
    const player2Name = document.getElementById('player2Name');
    const rating1 = document.getElementById('rating1');
    const rating2 = document.getElementById('rating2');

    function vibrate(ms = 20) {
        if (navigator.vibrate) navigator.vibrate(ms);
    }

    document.getElementById('joinBtn').onclick = () => {
        playerName = document.getElementById('nameInput').value.trim() || 'Игрок';
        socket.emit('join', playerName);
        vibrate(15);
    };

    socket.on('updateProfile', (data) => {
        starsEl.textContent = data.stars;
        crystalsEl.textContent = data.crystals;
        ratingEl.textContent = data.teamRating;
    });

    socket.on('waiting', (msg) => {
        statusEl.textContent = '⏳ ' + msg;
        waitingArea.classList.remove('hidden');
        matchArea.classList.add('hidden');
        resultArea.classList.add('hidden');
    });

    socket.on('queueUpdate', (count) => {
        queueCount.textContent = count;
    });

    socket.on('matchStart', (data) => {
        roomId = data.roomId;
        player1Name.textContent = data.player1;
        player2Name.textContent = data.player2;
        rating1.textContent = '📊 ' + data.rating1;
        rating2.textContent = '📊 ' + data.rating2;
        score1.textContent = '0';
        score2.textContent = '0';
        eventsLog.innerHTML = '';
        matchTime.textContent = "0'";
        statusEl.textContent = '🔴 МАТЧ ИДЁТ!';
        waitingArea.classList.add('hidden');
        matchArea.classList.remove('hidden');
        resultArea.classList.add('hidden');
        matchActive = true;
        vibrate(50);
    });

    socket.on('matchTime', (data) => {
        matchTime.textContent = data.time + "'";
    });

    socket.on('scoreUpdate', (data) => {
        score1.textContent = data.score1;
        score2.textContent = data.score2;
        vibrate(20);
    });

    socket.on('matchEvent', (event) => {
        const div = document.createElement('div');
        div.textContent = `${event.time}' ${event.text}`;
        if (event.type === 'goal') div.style.color = '#ffdd44';
        else if (event.type === 'red') div.style.color = '#ff4444';
        else if (event.type === 'yellow') div.style.color = '#ffcc00';
        else if (event.type === 'offside') div.style.color = '#88ccff';
        eventsLog.appendChild(div);
        eventsLog.scrollTop = eventsLog.scrollHeight;
        vibrate(30);
    });

    socket.on('matchResult', (data) => {
        matchActive = false;
        matchArea.classList.add('hidden');
        resultArea.classList.remove('hidden');
        
        const isWinner = data.result === 'p1' ? true : (data.result === 'p2' ? false : null);
        let title = '🤝 Ничья!';
        if (isWinner === true) title = '🎉 ПОБЕДА!';
        else if (isWinner === false) title = '😞 Поражение...';
        
        document.getElementById('resultTitle').textContent = title;
        document.getElementById('resultScore').textContent = `${data.score1} : ${data.score2}`;
        
        let details = '';
        if (data.stars1 > 0) details += `⭐ +${data.stars1} звёзд `;
        if (data.crystals1 > 0) details += `💎 +${data.crystals1} кристаллов`;
        if (data.stars2 > 0 && data.stars2 < 5) details += ` (соперник +${data.stars2})`;
        document.getElementById('resultDetails').textContent = details || 'Хорошая игра!';
        
        statusEl.textContent = '🏁 Матч завершён';
        vibrate(100);
        
        // Показываем все события
        if (data.events) {
            eventsLog.innerHTML = '';
            data.events.forEach(e => {
                const div = document.createElement('div');
                div.textContent = `${e.time}' ${e.text}`;
                eventsLog.appendChild(div);
            });
        }
    });

    socket.on('updateLeaders', (leaders) => {
        if (!leaders || leaders.length === 0) {
            leadersList.innerHTML = '<div class="leader-item" style="color:#8899aa;">Пока никого нет</div>';
            return;
        }
        leadersList.innerHTML = leaders.map((p, i) =>
            `<div class="leader-item">
                <span>${i+1}. ${p.name}</span>
                <span>⭐${p.stars} 📊${p.teamRating}</span>
            </div>`
        ).join('');
    });

    socket.on('error', (msg) => {
        statusEl.textContent = '❌ ' + msg;
        vibrate(60);
    });

    socket.on('packResult', (msg) => {
        statusEl.textContent = '📦 ' + msg;
        vibrate(40);
    });

    socket.on('matchEnd', (msg) => {
        statusEl.textContent = '❌ ' + msg;
        matchArea.classList.add('hidden');
        matchActive = false;
    });

    document.getElementById('endMatchBtn').onclick = () => {
        if (roomId && matchActive) {
            socket.emit('endMatch', roomId);
        }
    };

    document.getElementById('continueBtn').onclick = () => {
        resultArea.classList.add('hidden');
        socket.emit('join', playerName);
    };

    document.getElementById('openPackBtn').onclick = () => {
        socket.emit('openPack');
        vibrate(20);
    };

    window.onload = () => {
        setTimeout(() => document.getElementById('joinBtn').click(), 300);
    };
</script>
</body>
    </html>
